name: Workflow for ScholarScrib API Production

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main

env:
  SCHOLARSCRIB_ENV: prod

jobs:

  build_and_lint:
    uses: ./.github/workflows/build_and_lint.yml
    with:
      python-version-file: ".python-version"
    secrets: inherit

  deploy_to_heroku:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build_and_lint]
    uses: ./.github/workflows/deploy_heroku.yml
    secrets: inherit
